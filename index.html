<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音频调节与导出</title>
    <style>
      :root {
        --bg: #eef1f6;
        --panel: rgba(255, 255, 255, 0.72);
        --panel-strong: rgba(255, 255, 255, 0.92);
        --text: #1b1d22;
        --muted: #636a77;
        --accent: #1778ff;
        --border: rgba(255, 255, 255, 0.9);
        --shadow: 0 18px 48px rgba(23, 32, 58, 0.12);
        --radius: 22px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "SF Pro Display", "SF Pro Text", "PingFang SC", -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 8% -10%, #ffffff 0, transparent 48%),
          radial-gradient(circle at 100% 10%, #d7e6ff 0, transparent 42%),
          linear-gradient(160deg, #e9edf5 0%, #f5f7fb 56%, #e7edf8 100%);
        display: flex;
        justify-content: center;
        padding: 26px;
      }

      .app {
        width: min(1100px, 100%);
        border-radius: 30px;
        background: rgba(246, 248, 252, 0.68);
        backdrop-filter: blur(24px) saturate(130%);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: var(--shadow);
        padding: 22px;
        display: grid;
        gap: 18px;
      }

      .top {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .panel {
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: linear-gradient(155deg, var(--panel-strong), var(--panel));
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.85), 0 10px 26px rgba(26, 35, 58, 0.08);
        padding: 20px;
      }

      h2 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.2px;
      }

      .desc {
        margin-top: 8px;
        margin-bottom: 18px;
        color: var(--muted);
        font-size: 13px;
      }

      .upload {
        border: 1.5px dashed rgba(23, 120, 255, 0.45);
        background: rgba(255, 255, 255, 0.78);
        border-radius: 18px;
        padding: 20px;
        display: grid;
        gap: 12px;
        min-height: 210px;
      }

      .file-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      button,
      .btn-file {
        border: 0;
        border-radius: 12px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 120ms ease, filter 120ms ease;
      }

      button:hover,
      .btn-file:hover {
        transform: translateY(-1px);
        filter: brightness(1.02);
      }

      .btn-primary {
        background: linear-gradient(180deg, #2a88ff, #0f6fff);
        color: #fff;
        box-shadow: 0 6px 16px rgba(14, 95, 235, 0.28);
      }

      .btn-neutral {
        background: rgba(24, 31, 48, 0.08);
        color: #222;
      }

      .btn-file {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: fit-content;
        background: rgba(24, 31, 48, 0.08);
      }

      input[type="file"] {
        display: none;
      }

      .meta {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.45;
      }

      .controls {
        display: grid;
        gap: 16px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
      }

      .value {
        color: var(--accent);
        font-weight: 700;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      input[type="number"],
      select {
        width: 100%;
        border: 1px solid rgba(24, 31, 48, 0.16);
        background: rgba(255, 255, 255, 0.85);
        border-radius: 10px;
        padding: 9px 10px;
        font-size: 14px;
        color: var(--text);
      }

      audio {
        width: 100%;
        margin-top: 8px;
      }

      .status {
        margin-top: 8px;
        min-height: 20px;
        font-size: 13px;
        color: var(--muted);
      }

      .footer {
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: linear-gradient(155deg, var(--panel-strong), var(--panel));
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .footer .hint {
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 900px) {
        body {
          padding: 12px;
        }

        .top {
          grid-template-columns: 1fr;
        }

        .footer {
          flex-direction: column;
          align-items: stretch;
        }

        .footer button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="top">
        <article class="panel">
          <h2>本地音频</h2>
          <p class="desc">仅支持单文件上传/替换（mp3、m4a）</p>
          <div class="upload">
            <div class="file-row">
              <label class="btn-file" for="audioInput">选择或替换文件</label>
              <button class="btn-neutral" id="clearBtn" type="button">清空</button>
              <input id="audioInput" type="file" accept=".mp3,.m4a,audio/mp3,audio/m4a,audio/x-m4a" />
            </div>
            <div class="meta" id="fileMeta">未选择文件</div>
            <div>
              <div class="meta">原始音频试听</div>
              <audio id="originalPlayer" controls></audio>
            </div>
          </div>
        </article>

        <article class="panel">
          <h2>音频设置</h2>
          <p class="desc">默认仅调节音量并保持原采样率，可按需开启压缩或重采样</p>
          <div class="controls">
            <label class="field">
              <span class="label">高规格模式 <input id="reference22Enabled" type="checkbox" /></span>
              <span class="meta">固定输出为 44.1 kHz、128 kbps CBR、双声道；启用后忽略质量、压缩比例和采样率设置。</span>
            </label>

            <label class="field">
              <span class="label">音量增益 <span class="value" id="volumeValue">100%</span></span>
              <input id="volumeRange" type="range" min="100" max="400" step="1" value="100" />
            </label>

            <label class="field">
              <span class="label">MP3 质量(Q) <span class="value" id="qualityValue">Q2</span></span>
              <input id="qualityRange" type="range" min="0" max="9" step="1" value="2" />
            </label>

            <label class="field">
              <span class="label">目标大小压缩 <input id="compressionEnabled" type="checkbox" /></span>
              <span class="meta">默认关闭；开启后才按目标比例压缩、转为单声道并移除尾部静音。</span>
            </label>

            <label class="field" id="ratioField">
              <span class="label">目标压缩比例 <span class="value" id="ratioValue">50%</span></span>
              <input id="ratioRange" type="range" min="10" max="95" step="1" value="50" />
            </label>

            <label class="field">
              <span class="label">输出采样率</span>
              <select id="sampleRateSelect">
                <option value="0">保持原始采样率</option>
                <option value="44100">44.1 kHz</option>
              </select>
              <span class="meta">重采样可满足 44.1 kHz 交付规格，但不会恢复原音频已缺失的高频细节。</span>
            </label>

            <button class="btn-primary" id="previewBtn" type="button">生成并试听处理音频</button>
            <audio id="processedPlayer" controls></audio>
            <div class="status" id="status">等待上传音频</div>
          </div>
        </article>
      </section>

      <section class="footer">
        <div class="hint">导出前请用 <code>python3 server.py</code> 启动本机服务；GitHub Pages 页面也会连接到 <code>127.0.0.1:8000</code>。</div>
        <button class="btn-primary" id="exportBtn" type="button">导出 MP3</button>
      </section>
    </main>

    <script src="backend-config.js"></script>
    <script>
      const audioInput = document.getElementById("audioInput");
      const clearBtn = document.getElementById("clearBtn");
      const fileMeta = document.getElementById("fileMeta");
      const originalPlayer = document.getElementById("originalPlayer");
      const processedPlayer = document.getElementById("processedPlayer");
      const previewBtn = document.getElementById("previewBtn");
      const exportBtn = document.getElementById("exportBtn");
      const statusEl = document.getElementById("status");
      const volumeRange = document.getElementById("volumeRange");
      const qualityRange = document.getElementById("qualityRange");
      const reference22Enabled = document.getElementById("reference22Enabled");
      const compressionEnabled = document.getElementById("compressionEnabled");
      const ratioField = document.getElementById("ratioField");
      const ratioRange = document.getElementById("ratioRange");
      const sampleRateSelect = document.getElementById("sampleRateSelect");
      const volumeValue = document.getElementById("volumeValue");
      const qualityValue = document.getElementById("qualityValue");
      const ratioValue = document.getElementById("ratioValue");

      let sourceFile = null;
      let sourceDuration = 0;
      let sourceSampleRate = 0;
      let sourceObjectUrl = null;
      let processedBlob = null;
      let processedObjectUrl = null;
      let processedSettingsKey = "";
      const publicBackendBaseUrl = window.AUDIO_EDITOR_PUBLIC_BACKEND_URL || "";
      const localBackendBaseUrl = "http://127.0.0.1:8000";

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function backendBaseUrls() {
        const sameOrigin = location.hostname !== "jeffery-ho.github.io" ? "" : null;
        return [...new Set([publicBackendBaseUrl, sameOrigin, localBackendBaseUrl].filter((url) => url !== null))];
      }

      async function fetchWithTimeout(url, options, timeoutMs) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          return await fetch(url, { ...options, signal: controller.signal });
        } finally {
          clearTimeout(timer);
        }
      }

      function formatBytes(bytes) {
        if (!Number.isFinite(bytes)) return "-";
        const units = ["B", "KB", "MB", "GB"];
        let size = bytes;
        let idx = 0;
        while (size >= 1024 && idx < units.length - 1) {
          size /= 1024;
          idx += 1;
        }
        return `${size.toFixed(idx === 0 ? 0 : 2)} ${units[idx]}`;
      }

      function formatTargetResult(actualBytes, targetBytes) {
        if (actualBytes <= targetBytes) {
          return `目标≤${formatBytes(targetBytes)}`;
        }
        return `受采样率限制，未达到${formatBytes(targetBytes)}压缩目标`;
      }

      function formatProcessingSummary(actualBytes) {
        const parts = [formatBytes(actualBytes)];
        if (reference22Enabled.checked) {
          parts.push("高规格：44.1 kHz，128 kbps CBR，双声道");
          return parts.join("，");
        }
        if (compressionEnabled.checked) {
          const targetSize = Math.round(sourceFile.size * clampTargetRatio(ratioRange.value) / 100);
          parts.push(formatTargetResult(actualBytes, targetSize));
        } else {
          parts.push("未启用目标大小压缩");
        }
        parts.push(`Q${clampMp3Quality(qualityRange.value)}`);
        parts.push(Number(sampleRateSelect.value) === 44100 ? "44.1 kHz" : "保持原始采样率");
        return parts.join("，");
      }

      function revokeUrl(url) {
        if (url) URL.revokeObjectURL(url);
      }

      function clampVolumePercent(value) {
        const raw = Number(value);
        if (!Number.isFinite(raw)) return 100;
        return Math.max(100, Math.min(400, Math.round(raw)));
      }

      function clampMp3Quality(value) {
        const raw = Number(value);
        if (!Number.isFinite(raw)) return 2;
        return Math.max(0, Math.min(9, Math.round(raw)));
      }

      function clampTargetRatio(value) {
        const raw = Number(value);
        if (!Number.isFinite(raw)) return 50;
        return Math.max(10, Math.min(95, Math.round(raw)));
      }

      function getSettingsKey() {
        if (!sourceFile) return "";
        return [
          sourceFile.name,
          sourceFile.size,
          sourceFile.lastModified,
          clampVolumePercent(volumeRange.value),
          clampMp3Quality(qualityRange.value),
          reference22Enabled.checked,
          compressionEnabled.checked,
          clampTargetRatio(ratioRange.value),
          Number(sampleRateSelect.value) || 0,
          "mp3",
        ].join("|");
      }

      async function readAudioInfo(file) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        try {
          const buf = await file.arrayBuffer();
          const decoded = await ctx.decodeAudioData(buf.slice(0));
          return { duration: decoded.duration, sampleRate: decoded.sampleRate };
        } finally {
          await ctx.close();
        }
      }

      async function transcodeViaBackend() {
        if (!sourceFile) {
          throw new Error("请先上传音频");
        }
        const volumePercent = clampVolumePercent(volumeRange.value);
        const mp3Quality = clampMp3Quality(qualityRange.value);
        const targetRatio = clampTargetRatio(ratioRange.value);
        const sampleRate = Number(sampleRateSelect.value) || 0;
        const params = new URLSearchParams({
          volume_percent: String(volumePercent),
          mp3_quality: String(mp3Quality),
          reference_22_enabled: reference22Enabled.checked ? "1" : "0",
          compression_enabled: compressionEnabled.checked ? "1" : "0",
          target_ratio_percent: String(targetRatio),
          sample_rate: String(sampleRate),
          filename: sourceFile.name,
        });

        let lastError = null;
        for (const backendBaseUrl of backendBaseUrls()) {
          try {
            const timeoutMs = publicBackendBaseUrl && backendBaseUrl === publicBackendBaseUrl ? 120000 : 15000;
            const response = await fetchWithTimeout(`${backendBaseUrl}/api/transcode?${params.toString()}`, {
              method: "POST",
              headers: { "Content-Type": "application/octet-stream" },
              body: sourceFile,
            }, timeoutMs);
            if (!response.ok) {
              const msg = await response.text();
              lastError = new Error(msg || "后端转码失败");
              continue;
            }
            const blob = await response.blob();
            return { blob, ext: "mp3" };
          } catch (err) {
            lastError = err;
          }
        }
        throw new Error(lastError?.message || "无法连接公网或本机后端服务");
      }

      function updateValueUI() {
        volumeValue.textContent = `${clampVolumePercent(volumeRange.value)}%`;
        qualityValue.textContent = `Q${clampMp3Quality(qualityRange.value)}`;
        ratioValue.textContent = `${clampTargetRatio(ratioRange.value)}%`;
        const customSettingsEnabled = !reference22Enabled.checked;
        qualityRange.disabled = !customSettingsEnabled;
        compressionEnabled.disabled = !customSettingsEnabled;
        sampleRateSelect.disabled = !customSettingsEnabled;
        ratioRange.disabled = !customSettingsEnabled || !compressionEnabled.checked;
        ratioField.style.opacity = customSettingsEnabled && compressionEnabled.checked ? "1" : "0.5";
      }

      function resetProcessed() {
        processedBlob = null;
        processedSettingsKey = "";
        revokeUrl(processedObjectUrl);
        processedObjectUrl = null;
        processedPlayer.removeAttribute("src");
        processedPlayer.load();
      }

      function markProcessedDirty() {
        resetProcessed();
        if (sourceFile) {
          setStatus("参数已更新，请重新生成试听或直接导出");
        }
      }

      function clearAll() {
        sourceFile = null;
        sourceDuration = 0;
        sourceSampleRate = 0;
        revokeUrl(sourceObjectUrl);
        sourceObjectUrl = null;
        originalPlayer.removeAttribute("src");
        originalPlayer.load();
        fileMeta.textContent = "未选择文件";
        audioInput.value = "";
        resetProcessed();
        setStatus("等待上传音频");
      }

      audioInput.addEventListener("change", async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const validExt = /\.(mp3|m4a)$/i.test(file.name);
        if (!validExt) {
          clearAll();
          setStatus("仅支持 mp3 / m4a");
          return;
        }

        setStatus("正在读取音频...");
        try {
          sourceFile = file;
          const audioInfo = await readAudioInfo(file);
          sourceDuration = audioInfo.duration;
          sourceSampleRate = audioInfo.sampleRate;
          revokeUrl(sourceObjectUrl);
          sourceObjectUrl = URL.createObjectURL(file);
          originalPlayer.src = sourceObjectUrl;
          const sourceBitrate = sourceDuration > 0 ? Math.round((file.size * 8) / sourceDuration / 1000) : 128;
          fileMeta.textContent = `${file.name} | ${formatBytes(file.size)} | ${sourceDuration.toFixed(2)} 秒 | ${sourceSampleRate.toLocaleString()} Hz | 原始约 ${sourceBitrate} kbps`;
          resetProcessed();
          updateValueUI();
          setStatus("音频已就绪，可开始调节和试听");
        } catch (err) {
          clearAll();
          setStatus(err.message || "音频读取失败");
        }
      });

      clearBtn.addEventListener("click", clearAll);
      volumeRange.addEventListener("input", () => {
        updateValueUI();
        markProcessedDirty();
      });
      qualityRange.addEventListener("input", () => {
        updateValueUI();
        markProcessedDirty();
      });
      reference22Enabled.addEventListener("change", () => {
        updateValueUI();
        markProcessedDirty();
      });
      compressionEnabled.addEventListener("change", () => {
        updateValueUI();
        markProcessedDirty();
      });
      ratioRange.addEventListener("input", () => {
        updateValueUI();
        markProcessedDirty();
      });
      sampleRateSelect.addEventListener("change", markProcessedDirty);

      previewBtn.addEventListener("click", async () => {
        if (!sourceFile) {
          setStatus("请先上传一个音频文件");
          return;
        }
        setStatus("正在调用后端转码并生成试听...");
        previewBtn.disabled = true;
        try {
          const created = await transcodeViaBackend();
          processedBlob = created.blob;
          processedSettingsKey = getSettingsKey();
          revokeUrl(processedObjectUrl);
          processedObjectUrl = URL.createObjectURL(processedBlob);
          processedPlayer.src = processedObjectUrl;
          processedPlayer.play().catch(() => {});
          setStatus(`试听音频生成完成（${formatProcessingSummary(processedBlob.size)}）`);
        } catch (err) {
          setStatus(err.message || "生成试听失败");
        } finally {
          previewBtn.disabled = false;
        }
      });

      exportBtn.addEventListener("click", async () => {
        if (!sourceFile) {
          setStatus("请先上传一个音频文件");
          return;
        }
        exportBtn.disabled = true;
        setStatus("正在导出处理后音频...");
        try {
          let ext = "mp3";
          if (!processedBlob || processedSettingsKey !== getSettingsKey()) {
            const created = await transcodeViaBackend();
            processedBlob = created.blob;
            ext = created.ext;
            processedSettingsKey = getSettingsKey();
            revokeUrl(processedObjectUrl);
            processedObjectUrl = URL.createObjectURL(processedBlob);
            processedPlayer.src = processedObjectUrl;
          }
          const baseName = (sourceFile?.name || "processed-audio").replace(/\.[^.]+$/, "");
          const downloadUrl = URL.createObjectURL(processedBlob);
          const a = document.createElement("a");
          a.href = downloadUrl;
          a.download = `${baseName}-processed.${ext}`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(downloadUrl);
          setStatus(`导出完成（${formatProcessingSummary(processedBlob.size)}）`);
        } catch (err) {
          setStatus(err.message || "导出失败");
        } finally {
          exportBtn.disabled = false;
        }
      });

      updateValueUI();
    </script>
  </body>
</html>
